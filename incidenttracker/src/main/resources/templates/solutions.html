<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Manage Incident Solutions</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 2em; }
        table { border-collapse: collapse; width: 100%; margin-top: 1em; }
        th, td { border: 1px solid #ccc; padding: 8px; }
        th { background: #f0f0f0; }
        input[type="text"] { width: 90%; }
        button { padding: 4px 10px; }
    </style>
</head>
<body>
    <h2>Incident Solutions Management</h2>
    
    <!-- Navigation Links -->
    <div style="margin-bottom: 20px; text-align: center;">
        <a href="/api/incidents/table" style="text-decoration: none; background: #007bff; color: white; padding: 8px 16px; border-radius: 4px; margin: 0 5px;">View All Incidents</a>
        <a href="/api/incidents/suggestion-ui" style="text-decoration: none; background: #28a745; color: white; padding: 8px 16px; border-radius: 4px; margin: 0 5px;">Get Suggestions</a>
        <a href="/chat" style="text-decoration: none; background: #6c757d; color: white; padding: 8px 16px; border-radius: 4px; margin: 0 5px;">Chat Interface</a>
    </div>
    
    <form method="get" th:action="@{/api/incidents/solutions-ui}">
        <label for="search">Search by Description:</label>
        <input type="text" id="search" name="description" placeholder="Enter description..." th:value="${description}">
        <button type="submit">Search</button>
    </form>
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Description</th>
                <th>Solution</th>
                <th>Update Solution</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="incident : ${incidents}">
                <td th:text="${incident.id}"></td>
                <td th:text="${incident.description}"></td>
                <td>
                    <span th:id="'solutionDisplay-' + ${incident.id}" th:text="${incident.solution} ?: ''"></span>
                </td>
                <td>
                    <input type="text" th:id="'solutionInput-' + ${incident.id}" placeholder="New solution"/>
                    <button type="button" th:onclick="'updateSolution(' + ${incident.id} + ')'">Update</button>
                </td>
            </tr>
        </tbody>
    </table>
</body>
<script>
function updateSolution(incidentId) {
    const inputId = 'solutionInput-' + incidentId;
    const displayId = 'solutionDisplay-' + incidentId;
    const solution = document.getElementById(inputId).value.trim();
    if (!solution) {
        alert('Please enter a solution.');
        return;
    }
    fetch(`/api/incidents/${incidentId}/solution`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ solution: solution })
    })
    .then(response => response.json())
    .then(data => {
        document.getElementById(displayId).innerText = data.solution;
        document.getElementById(inputId).value = '';
        alert('Solution updated!');
    })
    .catch(() => alert('Failed to update solution.'));
}

// Add Enter key support for all solution inputs
document.addEventListener('DOMContentLoaded', function() {
    document.querySelectorAll('input[id^="solutionInput-"]').forEach(function(input) {
        input.addEventListener('keydown', function(event) {
            if (event.key === 'Enter') {
                event.preventDefault();
                // Extract incidentId from input's id
                const incidentId = this.id.split('-')[1];
                updateSolution(incidentId);
            }
        });
    });
});
</script>
</html>
